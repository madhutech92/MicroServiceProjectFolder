spring.application.name=order-service

server.port=8082

#---------------------Health & Metrics ----------------------------
management.endpoints.web.exposure.include=health,info,metrics

#---------------------registering Eureka Client--------------------
eureka.client.service-url.defaultZone=http://localhost:8761/eureka


#-----------------retry userService-------------------------
resilience4j.retry.instances.userServiceRetry.max-attempts=3
resilience4j.retry.instances.userServiceRetry.wait-duration=2s


#----------------Circuit Breaker: userServiceCB-------------
resilience4j.circuitbreaker.instances.userServiceCB.register-health-indicator=true
resilience4j.circuitbreaker.instances.userServiceCB.sliding-window-size=5
resilience4j.circuitbreaker.instances.userServiceCB.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.userServiceCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.userServiceCB.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.userServiceCB.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.userServiceCB.sliding-window-type=COUNT_BASED



# Set Prometheus endpoint path (default is /actuator/prometheus)
# management.endpoint.prometheus.access=read-only